<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seite nicht gefunden – Buscar</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F5A623; --yellow-dark:#D4841A; --yellow-deep:#B8661A;
    --bg:#F7F3EC; --card:#FFFFFF; --text-1:#1A1407; --text-2:#6B5E4A; --text-3:#A99C86; --line:#ECE2D0;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text-1);line-height:1.5;-webkit-font-smoothing:antialiased;
       min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}
  .brand{font-family:'Fraunces',serif;font-weight:900;font-size:22px;color:var(--yellow-dark);letter-spacing:-0.5px;margin-bottom:18px}
  .card{position:relative;max-width:440px;width:100%;border-radius:30px;padding:44px 30px 38px;text-align:center;color:#fff;overflow:hidden;
        background:linear-gradient(160deg,#F5A623 0%,#D4841A 58%,#B8661A 100%);box-shadow:0 20px 50px rgba(184,102,26,.32)}
  .card::before{content:'';position:absolute;top:-70px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.10)}
  .card::after{content:'';position:absolute;bottom:-90px;left:-50px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
  .code{font-family:'Fraunces',serif;font-weight:900;font-size:84px;letter-spacing:-3px;line-height:1;position:relative;z-index:1;text-shadow:0 3px 12px rgba(0,0,0,.14)}
  .headline{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-top:10px;position:relative;z-index:1}
  .sub{font-size:14px;opacity:.94;margin-top:8px;position:relative;z-index:1}
  .cta{display:inline-flex;align-items:center;gap:8px;margin-top:22px;background:#fff;color:var(--yellow-deep);font-weight:700;font-size:14px;
       padding:12px 24px;border-radius:999px;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.20);position:relative;z-index:1;transition:transform .15s}
  .cta:active{transform:scale(.96)}
  .cta svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .foot{font-size:12px;color:var(--text-3);margin-top:18px;text-align:center}
  .foot a{color:var(--yellow-dark);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="brand" translate="no">Buscar</div>
  <div class="card">
    <div class="code">404</div>
    <div class="headline" id="hl">Diese Seite gibt es nicht</div>
    <div class="sub" id="sub">Der Link ist alt oder vertippt – aber Paraguay wartet trotzdem auf dich.</div>
    <a class="cta" href="/" id="cta">Zur Startseite <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></a>
  </div>
  <div class="foot" id="foot">Oder direkt in die App: <a href="/app" id="footLink">Buscar öffnen</a></div>
<script>
  // Sprache wie auf der Landing: Deutsch -> de, Englisch -> en, sonst Spanisch
  (function(){
    var l=(navigator.language||'es').toLowerCase();
    var lang=l.indexOf('de')===0?'de':(l.indexOf('en')===0?'en':'es');
    var T={
      de:{t:'Seite nicht gefunden – Buscar',hl:'Diese Seite gibt es nicht',sub:'Der Link ist alt oder vertippt – aber Paraguay wartet trotzdem auf dich.',cta:'Zur Startseite',foot:'Oder direkt in die App: ',fl:'Buscar öffnen'},
      es:{t:'Página no encontrada – Buscar',hl:'Esta página no existe',sub:'El enlace es viejo o tiene un error – pero Paraguay te sigue esperando.',cta:'Ir al inicio',foot:'O directo a la app: ',fl:'Abrir Buscar'},
      en:{t:'Page not found – Buscar',hl:'This page doesn’t exist',sub:'The link is old or mistyped – but Paraguay is still waiting for you.',cta:'Go to homepage',foot:'Or straight to the app: ',fl:'Open Buscar'}
    };
    var x=T[lang];
    document.title=x.t;
    document.documentElement.lang=lang;
    document.getElementById('hl').textContent=x.hl;
    document.getElementById('sub').textContent=x.sub;
    document.getElementById('cta').firstChild.textContent=x.cta+' ';
    var f=document.getElementById('foot');f.firstChild.textContent=x.foot;
    document.getElementById('footLink').textContent=x.fl;
  })();
</script>
</body>
</html>
